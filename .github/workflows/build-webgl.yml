name: Build WebGL

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Don't cancel tag builds — a release build should always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # The Unity editor Docker image + Library cache can exhaust the runner's
      # ~14 GB free disk, failing image extraction with "no space left on
      # device" (exit 125). Reclaim ~25 GB of preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-webgl-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-webgl-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.8f1 # pinned: 6000.4.7f1 shadergraph has a CS0246 GUID bug on fresh imports, fixed in .8f1
          targetPlatform: WebGL

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-build
          path: build/WebGL/
          retention-days: 90

      # Release assets are flat files — zip the build so its directory
      # structure (index.html, Build/, TemplateData/) survives.
      # sudo: unity-builder's container leaves build/ owned by root.
      - name: Package build for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build
          sudo zip -r "WebGL-${GITHUB_REF_NAME}.zip" WebGL

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/WebGL-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
